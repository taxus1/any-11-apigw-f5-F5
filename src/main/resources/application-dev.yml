spring:
  application:
    name: apigw
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  cloud:
    gateway:
      # 路由定义从我们的 RedisRouteDefinitionRepository 读，不走 yml 静态路由
      discovery:
        locator:
          enabled: false
  # accesslog / app-auth 任一开启时才会连库（两套功能共用同一个数据源）；都关闭时下面这些不被读取。
  # 环境变量沿用 ACCESSLOG_DB_*（向后兼容），新增同义的 GATEWAY_DB_*。
  datasource:
    url: ${GATEWAY_DB_URL:${ACCESSLOG_DB_URL:jdbc:mysql://localhost:3306/apigw?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true}}
    username: ${GATEWAY_DB_USER:${ACCESSLOG_DB_USER:root}}
    password: ${GATEWAY_DB_PASSWORD:${ACCESSLOG_DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

# 转发链路参数：连不上上游（3s 握手不成）→ 502；上游半天不吭声（10s 不回）→ 504。
# 路由推送默认毫秒级；Pub/Sub 丢失时 5s 轮询兜底。三台部署把 expected-instances 固定为 3。
apigw:
  proxy:
    connect-timeout: 3s
    response-timeout: 10s
    route-refresh-interval: 5s
    route-config:
      node-id: ${GATEWAY_NODE_ID:}
      expected-instances: ${GATEWAY_EXPECTED_INSTANCES:0}
      poll-interval: 5s
      poll-interval-ms: 5000
      heartbeat-interval: 3s
      heartbeat-ttl: 12s
      switch-delay: 3s
      fence-grace: 2s
      max-clock-skew: 1s
    # 灰度标记请求头：值大小写敏感、精确匹配（多空格/大小写不一致一律当没带，回落按权重分）。
    # 默认 X-Gray-Tag，可经环境变量改；标记优先级永远高于权重，详见 README「灰度发布」。
    gray:
      tag-header: ${GRAY_TAG_HEADER:X-Gray-Tag}
  # 访问流水落库。本地默认关闭（无库也能起网关、跑转发）；生产置 true 并给数据源。
  # 攒批边界：500 条一批、最多等 2s 落一次；入口队列 2 万，满则丢日志计数、绝不反压转发；
  # 正常退出最多等 10s 把手里批次 flush 完。
  accesslog:
    enabled: ${ACCESSLOG_ENABLED:false}
    batch-size: 500
    flush-interval: 2s
    queue-capacity: 20000
    shutdown-await: 10s
  # 第三方接入鉴权。本地默认关闭（无库也能起网关）；生产置 APP_AUTH_ENABLED=true。
  # 开启后转发流量必须带 X-App-No + X-App-Secret 且过停用/有效期/来路名单校验。
  # 凭据/名单在内存缓存：管理侧改动经事件即时生效，多实例靠 10s 定时兜底收敛。
  app-auth:
    enabled: ${APP_AUTH_ENABLED:false}
    refresh-interval: 10s
    refresh-interval-ms: 10000
  # 限流（按接入应用：应用每分钟总量 + 应用下单来源地址，两层独立可配）。
  # 前提：与 app-auth 同时开启——应用编号取自鉴权后改写的可信 X-App-No。
  # 额度配置存库（gw_rate_limit，运营改完经事件即时生效，多实例 10s 兜底收敛）；
  # 窗口计数存 Redis（固定 60s 窗口、所有实例共享、单段 Lua 原子判定，窗口键 TTL 自动回收）。
  # 计数存储故障：redis-timeout 到点不等 + 连续失败熔断（熔断期不发 Redis），
  # 默认 fail-open（短暂放行并告警，优先不拖垮网关）；要 fail-closed 置 false（回 503）。
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    refresh-interval: 10s
    refresh-interval-ms: 10000
    redis-timeout: 100ms
    fail-open-on-error: ${RATE_LIMIT_FAIL_OPEN:true}
    circuit-breaker-threshold: 5
    circuit-breaker-open-ms: 5000
    window-seconds: 60
  # 用户登录令牌鉴权（自签 JWT，算法钉死 HS256）。
  # 密钥只走环境变量/外部配置，绝不写进仓库；默认空 = 未启用：
  #   - 开放路由（authRequired=0）照常转发；
  #   - 需登录路由（authRequired=1）在未配密钥时 fail-closed 回 503，绝不裸放行。
  # token-secret：验令牌签名；pass-secret：盖 X-Gateway-Pass 通行标记（与上游共享，缺省回退 token-secret）。
  # 过期判定零宽限：now >= exp 即过期，正好压点也按过期处理，没有宽限期可配。
  user-auth:
    token-secret: ${USER_AUTH_TOKEN_SECRET:}
    pass-secret: ${USER_AUTH_PASS_SECRET:}
    issuer: ${USER_AUTH_ISSUER:}
  # 跨域：默认任意来源、不带 Cookie 凭证（令牌走 Authorization 头）；生产请把来源收敛成自己的页面。
  # 前端跨域要读的身份头/追踪号/错误标识在 exposed-headers 里默认放行，Authorization 在允许请求头内。
  cors:
    enabled: ${CORS_ENABLED:true}
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:*}
    max-age: 1h

logging:
  level:
    com.apigw: debug
  # 访问审计日志单独打，便于查账时直接取「进/出两段、traceId 串联」的记录
  group:
    access:
      - access-log
